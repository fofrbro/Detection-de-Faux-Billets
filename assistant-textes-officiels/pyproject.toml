[project]
name = "assistant-textes-officiels"
version = "0.1.0"
description = "Assistant RAG qui répond aux questions des citoyens sur les textes officiels sénégalais"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "typer>=0.12",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.scripts]
assistant = "assistant.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "db: tests nécessitant une base PostgreSQL + pgvector (docker compose up -d)",
]
